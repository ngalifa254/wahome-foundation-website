name: Deploy v2 Preview to GitHub Pages

on:
  push:
    # The main branch is deployed by deploy.yml, which injects the public
    # Firebase and Turnstile build-time configuration. Keep this workflow for
    # v2 previews so it cannot overwrite the configured main site.
    branches: ["v2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          path: v2

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            main/pnpm-lock.yaml
            v2/pnpm-lock.yaml

      - name: Install main dependencies
        working-directory: main
        run: pnpm install --frozen-lockfile

      - name: Check PayPal client ID
        run: |
          if [ -z "$VITE_PAYPAL_CLIENT_ID" ]; then
            echo "::error::Set VITE_PAYPAL_CLIENT_ID as an Actions repository variable or secret before deploying."
            exit 1
          fi
        env:
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID || secrets.VITE_PAYPAL_CLIENT_ID }}

      - name: Build main
        working-directory: main
        run: pnpm run build
        env:
          VITE_BASE_PATH: /wahome-foundation-website/
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID || secrets.VITE_PAYPAL_CLIENT_ID }}

      - name: Install v2 dependencies
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Build v2
        working-directory: v2
        env:
          VITE_BASE_PATH: /wahome-foundation-website/v2/
        run: pnpm run build

      - name: Combine builds
        run: |
          mkdir -p site
          cp -r main/dist/. site/
          mkdir -p site/v2
          cp -r v2/dist/. site/v2/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
